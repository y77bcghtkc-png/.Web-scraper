name: HNW B2B Contact Scraper
on:
name: HNW B2B Contact Scraper
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'
permissions:
  contents: write
jobs:
  run-scraper:
    runs-on: ubuntu-latest
...
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'
jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run the scraper script
      run: python scraper.py
    - name: Commit and push results back to repo
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        if [ -f "hnw_b2b_contacts.csv" ]; then
          git add hnw_b2b_contacts.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update scraped HNW contact data [skip ci]" && git push)
        else
          echo "No CSV file generated to commit."
        fi
